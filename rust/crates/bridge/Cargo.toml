[package]
name = "bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = { workspace = true }
log = "0.4"
flutter_rust_bridge = "=2.12.0"
book_parser = { path = "../book_parser" }
layout_engine = { path = "../layout_engine" }
book_source_engine = { path = "../book_source_engine" }
reader_core = { path = "../reader_core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lazy_static = "1.4"
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4"] }
encoding_rs = "0.8"
zip = "0.6"
lru = "0.12"                  # 结构化路径分页缓存

[features]
default = ["js-engine"]
js-engine = ["book_parser/js-engine", "reader_core/js-engine"]

[dev-dependencies]

[package]
name = "layout_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
unicode-segmentation = "1.11"
ab_glyph = "0.2"           # 字体加载（measure_char 改走 ttf-parser 直读 hmtx）
owned_ttf_parser = "0.25"  # 直读 hmtx/units_per_em，绕开 ab_glyph 缩放层 CFF advance bug
lru = "0.12"               # LRU 缓存
rayon = "1.8"              # 并行排版

[dev-dependencies]
criterion = "0.5"          # 性能基准测试

[[bench]]
name = "layout_bench"
harness = false

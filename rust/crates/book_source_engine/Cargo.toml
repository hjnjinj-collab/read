[package]
name = "book_source_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
scraper = "0.20"           # HTML 解析 (CSS 选择器)
regex = "1.10"             # 正则表达式
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1.35", features = ["full"] }
once_cell = "1.19"
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"

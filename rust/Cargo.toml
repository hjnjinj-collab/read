[workspace]
members = [
    "crates/book_parser",
    "crates/layout_engine",
    "crates/bridge",
    "crates/book_source_engine",
    "crates/reader_core",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# 字体和排版
ab_glyph = "0.2"
ttf-parser = "0.20"

# 编码检测
chardetng = "0.1"
encoding_rs = "0.8"

# 正则
regex = "1.10"

# FFI
flutter_rust_bridge = "2.12"

# 缓存
lru = "0.12"

# 日志
log = "0.4"

# 第二阶段新增依赖
rquickjs = { version = "0.6", features = ["array-buffer", "classes"] }
memmap2 = "0.9"
unicode-segmentation = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
async-trait = "0.1"

<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>首页 Dashboard · 布局稿</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="phone" id="phone">
    <header class="topbar">
      <div>
        <div class="hello">晚上好</div>
        <div class="app-title" id="pageTitle">首页</div>
      </div>
      <button type="button" class="ghost-btn" id="modeBtn">演示数据</button>
    </header>

    <main class="page on" id="page-home" data-page="home">
      <!-- 1. Hero 轮换：首帧永远是今日目标 -->
      <section class="card hero-card" id="heroCard">
        <div class="hero-top">
          <span class="hero-badge" id="heroBadge">今日目标</span>
          <div class="hero-dots" id="heroDots" aria-hidden="true"></div>
        </div>
        <div id="heroSlide"></div>
      </section>

      <!-- 2. 统计（折线图上方） -->
      <section class="stats">
        <div class="card stat">
          <div class="stat-lb">读过</div>
          <div class="stat-val">12<small>本</small></div>
        </div>
        <div class="card stat">
          <div class="stat-lb">累计</div>
          <div class="stat-val">36.5<small>h</small></div>
        </div>
        <div class="card stat">
          <div class="stat-lb">连续</div>
          <div class="stat-val">5<small>天</small></div>
        </div>
      </section>

      <!-- 3. 折线图 -->
      <section class="card chart-card">
        <div class="sec-head">
          <div>
            <div class="sec-title">近 7 日阅读</div>
            <div class="sec-sub">分钟 · 折线趋势</div>
          </div>
          <div class="sec-kpi"><span id="weekSum">126</span><small>分钟</small></div>
        </div>
        <div class="chart-wrap">
          <svg class="chart" id="chart" viewBox="0 0 320 120" preserveAspectRatio="none"></svg>
          <div class="chart-labels" id="chartLabels"></div>
        </div>
        <div class="chart-legend">
          <span><i class="dot today"></i>今日</span>
          <span><i class="dot"></i>往日</span>
        </div>
      </section>

      <!-- 4. 最近阅读（底部） -->
      <section class="sec-block">
        <div class="sec-head plain">
          <div class="sec-title">最近阅读</div>
          <span class="link">全部</span>
        </div>
        <div class="hrow" id="recentRow"></div>
      </section>
    </main>

    <main class="page" id="page-shelf" data-page="shelf">
      <div class="shelf-hint">书架 = 书库 + 薄续读条（已定稿，Flutter 落地）</div>
      <section class="poster-card" id="thinContinue">
        <div class="poster-bg"></div>
        <div class="poster-row">
          <div class="cover c1 tiny"></div>
          <div class="poster-meta">
            <div class="badge">继续阅读</div>
            <div class="name">雪中悍刀行</div>
            <div class="ch">第 128 章 · 风雪夜归人</div>
            <div class="pbar"><i style="width:42%"></i></div>
          </div>
          <button type="button" class="poster-cta">继续</button>
        </div>
      </section>
      <div class="grid" id="shelfGrid"></div>
    </main>

    <nav class="tabbar" role="tablist">
      <button type="button" class="tab on" data-tab="home"><span class="ti">◎</span><span>首页</span></button>
      <button type="button" class="tab" data-tab="shelf"><span class="ti">▤</span><span>书架</span></button>
      <button type="button" class="tab" disabled><span class="ti">☁</span><span>书源</span></button>
      <button type="button" class="tab" disabled><span class="ti">⚙</span><span>设置</span></button>
    </nav>
  </div>
  <script src="index.js"></script>
</body>
</html>
